name: DockerHub image push

on:
  push:
    branches: [ "master" ]

jobs:
  docker_hub_image_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build and push Docker images
        run: |
          docker build -f docker/simple-call-server.Dockerfile -t vsepike/simple-call-server:${{ env.TAG }} -t vsepike/simple-call-server:latest .
          docker push vsepike/simple-call-server --all-tags
